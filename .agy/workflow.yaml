version: "1.0"
project:
  name: "agentic-workflow-orchestrator"

workflow:
  phases:
    - name: "refinement"
      command: "/grill-me"
      output: "docs/PRD.md"
    - name: "specification"
      skill: "to-spec"
      output: "docs/specs/"
    - name: "ticketization"
      skill: "to-ticket"
      output: "tasks.json"
    - name: "execution"
      skill: "implement-spec"
      approach: "tdd-red-green-refactor"
    - name: "review"
      skill: "code-review"

orchestration:
  approach: "tdd-contract-first"
  rules:
    - "Write shared interface contracts as root dependencies before implementation."
    - "Strictly enforce Red-Green-Refactor TDD cycle (Red -> Green -> Refactor) for every subagent task."
    - "Isolate parallel modules using interface stubs or mocks until integration."

subagents:
  max_parallel: 3
  execution_mode: "dependency-graph"

